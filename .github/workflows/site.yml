name: Documentation site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install PNPM and Bash tooling
        run: |
          npm install --global pnpm@10.34.9
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and content
        run: |
          pnpm format:check
          pnpm check
      - name: Test site logic
        run: pnpm test:site
      - name: Verify executable documentation
        run: |
          shellcheck -x -P . docs/examples/*.sh
          pnpm test:examples
      - name: Build static site
        run: pnpm build
      - name: Install browser
        run: pnpm --filter @koi/site exec playwright install --with-deps chromium
      - name: Test desktop and mobile browsers
        run: pnpm test:browser
