name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install bash bats-core shellcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Check and test
        shell: bash
        run: |
          bash -n koi scripts/test tests/fixtures/commands.sh
          sh -n scripts/install.sh
          shellcheck koi scripts/test scripts/install.sh tests/fixtures/commands.sh
          ./scripts/test
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install PNPM and run distribution tests
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm test:distribution
      - name: Install mise for local distribution fixtures
        if: runner.os == 'macOS'
        run: brew install mise
      - name: Test release installation with Homebrew and mise
        if: runner.os == 'macOS'
        run: |
          pnpm test:distribution:smoke brew
          pnpm test:distribution:smoke mise
